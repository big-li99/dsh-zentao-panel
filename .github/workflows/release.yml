name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="$TAG" '$0 ~ "^## \\[" tag "\\]" {flag=1; next} flag && /^## /{exit} flag' CHANGELOG.md > notes.md
          # CHANGELOG 里没有对应小节时兜底，避免 Release 建不出来
          [ -s notes.md ] || echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)。" > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "dsh-zentao-panel $GITHUB_REF_NAME" --notes-file notes.md
